<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justificativa Metodológica — Polígonos de Voronoi na APS | DEMAS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>" />

  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Highlight.js & Marked.js & Mermaid.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --accent: #10b981;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-main);
      text-decoration: none;
    }

    .nav-brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      list-style: none;
    }

    .nav-link {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }

    .nav-link:hover {
      color: var(--primary);
      background: var(--primary-light);
    }

    .nav-btn-primary {
      font-size: 13px;
      font-weight: 600;
      color: white;
      background: var(--primary);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn-primary:hover {
      background: var(--primary-hover);
    }

    /* Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .breadcrumb a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      color: var(--primary);
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 40px 48px;
      margin-bottom: 32px;
    }

    @media (max-width: 768px) {
      .card {
        padding: 24px 20px;
      }
    }

    /* Markdown Styling */
    .markdown-body {
      font-size: 15.5px;
      line-height: 1.75;
      color: #334155;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: #0f172a;
      font-weight: 700;
      margin-top: 32px;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .markdown-body h1 {
      font-size: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-top: 0;
    }

    .markdown-body h2 {
      font-size: 21px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-top: 36px;
    }

    .markdown-body h3 {
      font-size: 17px;
    }

    .markdown-body p {
      margin-bottom: 16px;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      padding: 12px 20px;
      background: #f8fafc;
      color: #475569;
      font-style: italic;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-bottom: 20px;
    }

    .markdown-body hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }

    .markdown-body ul,
    .markdown-body ol {
      margin-bottom: 18px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      font-size: 14px;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body th {
      background: #f1f5f9;
      font-weight: 600;
      color: #0f172a;
    }

    .markdown-body tr:nth-child(even) {
      background: #f8fafc;
    }

    .markdown-body a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      background: #f1f5f9;
      color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
    }

    .markdown-body pre {
      background: #1e293b !important;
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      color: #f8fafc;
      padding: 0;
    }

    .mermaid {
      text-align: center;
      margin: 24px 0;
      background: #ffffff;
      padding: 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    footer {
      text-align: center;
      padding-top: 32px;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="../" class="nav-brand">
        <div class="nav-brand-icon">🏥</div>
        DEMAS Playground
      </a>
      <ul class="nav-links">
        <li><a href="../dashboard.html" class="nav-link" style="color: var(--primary); font-weight: 600;">📊 Dashboard</a></li>
        <li><a href="../" class="nav-link">Início</a></li>
        <li><a href="../playground/" class="nav-btn-primary">⚡ Acessar Webmap</a></li>
        <li><a href="https://github.com/kauevestena/demas_playground" target="_blank" rel="noopener" class="nav-link">GitHub</a></li>
      </ul>
    </div>
  </header>

  <div class="container">
    <div class="breadcrumb">
      <a href="../">DEMAS Playground</a> &rsaquo;
      <span>Documentação Metodológica</span> &rsaquo;
      <span>Justificativa dos Polígonos de Voronoi</span>
    </div>

    <main class="card">
      <article id="doc-content" class="markdown-body">
        <p>Carregando documentação metodológica...</p>
      </article>
    </main>

    <footer>
      <p>
        Plataforma DEMAS &bull; Análise Espacial de Saúde Pública &bull;
        <a href="../playground/">Webmap Interativo</a> &bull;
        <a href="https://github.com/kauevestena/demas_playground" target="_blank" rel="noopener">Repositório GitHub</a>
      </p>
    </footer>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

    // Fetch and render markdown document
    fetch('justificativa_voronoi_territorios_ubs.md')
      .then(res => {
        if (!res.ok) throw new Error('Não foi possível carregar o arquivo markdown');
        return res.text();
      })
      .then(async markdown => {
        const container = document.getElementById('doc-content');
        container.innerHTML = marked.parse(markdown);

        // Highlight code blocks
        container.querySelectorAll('pre code').forEach(block => {
          hljs.highlightElement(block);
        });

        // Render mermaid diagrams
        container.querySelectorAll('.language-mermaid').forEach(el => {
          const pre = el.parentElement;
          const graphCode = el.textContent;
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = graphCode;
          pre.replaceWith(div);
        });

        await mermaid.run();
      })
      .catch(err => {
        document.getElementById('doc-content').innerHTML = `
          <h1>Erro ao carregar documento</h1>
          <p>Ocorreu um erro ao carregar <code>justificativa_voronoi_territorios_ubs.md</code>: ${err.message}</p>
          <p>Você pode acessar o arquivo diretamente no repositório: <a href="justificativa_voronoi_territorios_ubs.md">justificativa_voronoi_territorios_ubs.md</a></p>
        `;
      });
  </script>
</body>
</html>
